# ============================================
# Docker Compose - 本地开发环境配置
# ============================================
# 使用方式：
#   本地开发: docker compose up -env_file .env 
#   生产环境: docker compose -f docker-compose.prod.yml  -env_file .env(生产环境env，自行配置)  up -d
# ============================================

services:
  # ---------- 后端服务 ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-agent-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # ==================== 应用基础 ====================
      - APP_ENV=${APP_ENV:-prod}
      - APP_NAME=${APP_NAME:-my-agent-py}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-info}

      # ==================== PostgreSQL 数据库 ====================
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-my_agent}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}

      # ==================== Redis 缓存 ====================
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - REDIS_DB=${REDIS_DB:-3}

      # ==================== JWT 认证 ====================
      - JWT_SECRET=${JWT_SECRET:-123456}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-60}
      - JWT_ISSUER=${JWT_ISSUER:-my-agent}

      # ==================== DeepSeek 配置（系统默认模型） ====================
      # 其他提供商通过用户自定义模型功能配置
      - AI_DEEPSEEK_API_KEY=${AI_DEEPSEEK_API_KEY}
      - AI_DEEPSEEK_BASE_URL=${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - AI_DEEPSEEK_MODEL_NAME=${AI_DEEPSEEK_MODEL_NAME:-deepseek-chat}
      - AI_DEEPSEEK_TEMPERATURE=${AI_DEEPSEEK_TEMPERATURE:-0.7}
      - AI_DEEPSEEK_TIMEOUT=${AI_DEEPSEEK_TIMEOUT:-30}

      # ==================== Embedding 向量化 ====================
      - AI_EMBEDDING_PROVIDER=${AI_EMBEDDING_PROVIDER:-local}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - AI_EMBEDDING_DIMENSION=${AI_EMBEDDING_DIMENSION:-512}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY:-}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL:-}

      # ==================== 对话上下文 & RAG ====================
      - CONVERSATION_CACHE_TTL=${CONVERSATION_CACHE_TTL:-3600}
      - CONVERSATION_CACHE_MAX_MESSAGES=${CONVERSATION_CACHE_MAX_MESSAGES:-20}
      - MAX_HISTORY_MESSAGES=${MAX_HISTORY_MESSAGES:-20}
      - MAX_HISTORY_TOKENS=${MAX_HISTORY_TOKENS:-4000}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD:-0.6}

      # ==================== Tavily 搜索 ====================
      - TAVILY_API_KEY=${TAVILY_API_KEY}

      # ==================== OSS 对象存储 ====================
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_REGION=${OSS_REGION:-us-west-1}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_CUSTOM_DOMAIN=${OSS_CUSTOM_DOMAIN:-}
      - OSS_OBJECT_PREFIX=${OSS_OBJECT_PREFIX:-}

      # ==================== Langfuse 可观测性 ====================
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      # ==================== 挂载本地嵌入模型缓存 ====================
      # 与 celery-worker 共享同一份模型缓存
      - ${USERPROFILE:-.}/.cache/fastembed:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - my-agent-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/api/chat/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: my-agent-celery
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -I app.tasks.document_tasks,app.tasks.embedding_tasks
    environment:
      # ==================== 应用基础 ====================
      - APP_ENV=${APP_ENV:-prod}
      - APP_NAME=${APP_NAME:-my-agent-py}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-info}

      # ==================== PostgreSQL 数据库 ====================
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-my_agent}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-123456}

      # ==================== Redis 缓存 ====================
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      - REDIS_DB=${REDIS_DB:-3}

      # ==================== Celery 消息队列 ====================
      - CELERY_BROKER_DB=${CELERY_BROKER_DB:-1}
      - CELERY_RESULT_DB=${CELERY_RESULT_DB:-2}

      # ==================== Embedding 向量化 ====================
      - AI_EMBEDDING_PROVIDER=${AI_EMBEDDING_PROVIDER:-local}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - AI_EMBEDDING_DIMENSION=${AI_EMBEDDING_DIMENSION:-512}

      # ==================== OSS 对象存储 ====================
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET=${OSS_BUCKET}
      - OSS_REGION=${OSS_REGION:-us-west-1}
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_CUSTOM_DOMAIN=${OSS_CUSTOM_DOMAIN:-}
      - OSS_OBJECT_PREFIX=${OSS_OBJECT_PREFIX:-}
    volumes:
      # ==================== 挂载本地嵌入模型缓存 ====================
      # Windows 用户需先在本地下载模型：
      #   pip install fastembed
      #   python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-zh-v1.5')"
      # 模型会下载到 ~/.cache/fastembed 目录
      - ${USERPROFILE:-.}/.cache/fastembed:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - my-agent-network

  # ---------- 前端服务 ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: my-agent-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    networks:
      - my-agent-network

  # ---------- PostgreSQL 数据库 ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: my-agent-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-123456}
      - POSTGRES_DB=${DB_NAME:-my_agent}
      - TZ=Asia/Shanghai
      - PGTZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - my-agent-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: unless-stopped
    command: redis-server --requirepass 123456
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - my-agent-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "123456", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------- 数据卷 ----------
volumes:
  postgres_data:
  redis_data:

    # ---------- 网络 ----------
networks:
  my-agent-network:
    driver: bridge
